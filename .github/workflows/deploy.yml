name: Deploy to Production VM

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html
            sudo git fetch origin
            sudo git reset --hard origin/main
            sudo git clean -fd
            # Backend do leaderboard: o git clean apagava o node_modules (o
            # processo só seguia de pé por já estar carregado na memória).
            cd /var/www/html/backend
            sudo npm ci --omit=dev --no-audit --no-fund
            cd /var/www/html
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo systemctl reload nginx
            # Recarrega o backend com o código novo (roda com o usuário da VM).
            pm2 restart housegames-backend --update-env || (cd /var/www/html/backend && pm2 start server.js --name housegames-backend)
            pm2 save
            echo "Deployment successful!"
